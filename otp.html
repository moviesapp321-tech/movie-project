<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Verify OTP - Movie Website</title>

    <link rel="stylesheet" href="otp.css" />
  </head>

  <body>
    <div class="otp-container">
      <div class="otp-card">
        <h1>🎬 Movie Website</h1>

        <h2>Verify OTP</h2>

        <p class="message">
          We have sent a 6-digit OTP to your registered email.
        </p>

        <p id="email-display" class="email"></p>

        <form id="otp-form">
          <label for="otp">Enter OTP</label>

          <input
            type="text"
            id="otp"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            required
          />

          <button type="submit" id="verify-btn">Verify OTP</button>
        </form>

        <p id="status-message"></p>

        <button type="button" id="back-login" class="back-btn">
          Back to Login
        </button>
      </div>
    </div>

    <script src="otp.js"></script>
  </body>
</html>
